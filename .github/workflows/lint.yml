# Ruff lint + format check (issue #658). Non-blocking while the codebase is
# brought to the configured standard: the config in pyproject.toml is the
# target, this job reports the distance to it on every PR, and it flips to
# blocking (drop continue-on-error) after the one-time mechanical
# `ruff check --fix` + `ruff format` pass lands. The ruff version comes from
# uv.lock, so lint verdicts cannot drift with upstream releases.
name: lint
on:
  pull_request:
    paths:
      - "**.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/lint.yml"

jobs:
  ruff:
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory until the mechanical pass lands
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: ruff check
        run: uv run --frozen ruff check --output-format github .
      - name: ruff format check
        if: always()
        run: uv run --frozen ruff format --check .
