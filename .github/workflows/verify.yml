name: verify

on:
  pull_request:
    paths:
      - "codes/**"
      - "examples/**"
      - "verify/**"
      - "schema/**"
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: verify all submissions
        run: uv run --frozen python verify/verify_all.py
