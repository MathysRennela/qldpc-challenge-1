name: verify

on:
  pull_request:
    paths:
      - "codes/**"
      - "examples/**"
      - "verify/**"
      - "schema/**"
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: verify all submissions
        run: python verify/verify_all.py
